<!doctype html>
<html lang="en">
    <!-- read if cute :3 -->
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <link rel="icon" href="%sveltekit.assets%/assets/favicon.png" />
        <link rel="icon" href="%sveltekit.assets%/assets/favicon-dark.png" media="(prefers-color-scheme: dark)" />
        <link rel="preload" href="%sveltekit.assets%/fonts/Inter.var-subset.woff2" as="font" type="font/woff2" crossorigin />
        <meta name="author" content="Vencord Contributors" />
        <meta name="theme-color" content="#c8566c" />
        <meta name="darkreader-lock" />
        <link rel="sitemap" href="/sitemap.xml" />
        <script>
            // apply the saved (or system) theme before first paint to avoid a flash of the wrong colours
            (() => {
                let t = localStorage.theme?.toLowerCase();
                if (t !== "light" && t !== "dark")
                    t = matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark";
                document.documentElement.dataset.theme = t;
            })();
        </script>
        %sveltekit.head%
    </head>
    <body data-sveltekit-preload-data="hover">
        <div style="display: contents">%sveltekit.body%</div>
    </body>
</html>
